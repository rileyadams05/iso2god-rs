[package]
name = "iso2god"
version = "2.0.0"
description = "A tool to convert between Xbox 360 ISO and Games On Demand file formats"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.97", features = ["backtrace"] }
bitflags = "2.9.0"
byteorder = "1.5.0"
clap = { version = "4.5.32", features = ["derive"] }
crossterm = "0.29.0"
fs2 = "0.4.3"
num_enum = "0.7.3"
rayon = "1.10.0"
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"

[target.'cfg(windows)'.dependencies]
self_update = { version = "1.2.0", default-features = false, features = ["ureq", "native-tls", "github", "checksums"] }

[target.'cfg(target_os = "linux")'.dependencies]
self_update = { version = "1.2.0", default-features = false, features = ["ureq", "rustls", "github", "checksums"] }

[dev-dependencies]
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
serde-aux = "4.6.0"

[profile.release]
strip = true
lto = true
